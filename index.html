<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe Arena</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #1e293b; padding: 24px; border-radius: 20px; width: 100%; max-width: 360px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); text-align: center; }
    h1 { margin: 0 0 4px 0; font-size: 1.6rem; color: #38bdf8; }
    .badge { display: inline-block; background: #334155; color: #94a3b8; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 16px; }
    .status { margin: 12px 0; font-weight: 700; font-size: 1.25rem; color: #38bdf8; min-height: 32px; display: flex; align-items: center; justify-content: center; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px auto; max-width: 270px; }
    .cell { aspect-ratio: 1; background: #334155; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 800; cursor: pointer; user-select: none; transition: transform 0.1s ease, background 0.2s ease; }
    .cell:active { transform: scale(0.95); background: #475569; }
    .cell.x { color: #38bdf8; }
    .cell.o { color: #f43f5e; }
    .btn-reset { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .btn-reset:active { background: #0369a1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tic-Tac-Toe Arena</h1>
    <div class="badge">Pass & Play (2 Players / 1 Screen)</div>

    <div id="status" class="status">Player X's Turn</div>

    <div class="grid" id="grid">
      <div class="cell" onclick="handleCellTap(0)"></div>
      <div class="cell" onclick="handleCellTap(1)"></div>
      <div class="cell" onclick="handleCellTap(2)"></div>
      <div class="cell" onclick="handleCellTap(3)"></div>
      <div class="cell" onclick="handleCellTap(4)"></div>
      <div class="cell" onclick="handleCellTap(5)"></div>
      <div class="cell" onclick="handleCellTap(6)"></div>
      <div class="cell" onclick="handleCellTap(7)"></div>
      <div class="cell" onclick="handleCellTap(8)"></div>
    </div>

    <button onclick="restartRound()" class="btn-reset">New Round 🔄</button>
  </div>

  <script>
    let board = Array(9).fill(null);
    let turn = 'X';
    let isGameOver = false;

    function handleCellTap(idx) {
      if (isGameOver || board[idx]) return;

      board[idx] = turn;
      renderGrid();

      const winner = getWinner();
      if (winner) {
        isGameOver = true;
        const st = document.getElementById('status');
        st.innerText = '🏆 Player ' + winner + ' Won!';
        st.style.color = (winner === 'X' ? '#38bdf8' : '#f43f5e');
        return;
      }

      if (board.every(val => val !== null)) {
        isGameOver = true;
        const st = document.getElementById('status');
        st.innerText = '🤝 Match Draw!';
        st.style.color = '#94a3b8';
        return;
      }

      turn = turn === 'X' ? 'O' : 'X';
      const st = document.getElementById('status');
      st.innerText = "Player " + turn + "'s Turn";
      st.style.color = (turn === 'X' ? '#38bdf8' : '#f43f5e');
    }

    function renderGrid() {
      const cells = document.getElementsByClassName('cell');
      for (let i = 0; i < 9; i++) {
        cells[i].innerText = board[i] || '';
        cells[i].className = 'cell ' + (board[i] ? board[i].toLowerCase() : '');
      }
    }

    function getWinner() {
      const winCombos = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      for (let c of winCombos) {
        if (board[c[0]] && board[c[0]] === board[c[1]] && board[c[1]] === board[c[2]]) {
          return board[c[0]];
        }
      }
      return null;
    }

    function restartRound() {
      board = Array(9).fill(null);
      turn = 'X';
      isGameOver = false;
      renderGrid();
      const st = document.getElementById('status');
      st.innerText = "Player X's Turn";
      st.style.color = '#38bdf8';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncGrid Multiplayer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center; }
    h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; }
    .mode-switch { display: flex; gap: 8px; margin-bottom: 16px; background: #0f172a; padding: 4px; border-radius: 10px; }
    .mode-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #94a3b8; font-weight: 600; cursor: pointer; border-radius: 8px; }
    .mode-btn.active { background: #0284c7; color: white; }
    .status { margin: 10px 0; font-weight: 600; font-size: 1rem; color: #38bdf8; min-height: 24px; }
    .role-text { font-size: 0.9rem; color: #94a3b8; margin-bottom: 12px; }
    .controls { display: flex; gap: 8px; margin-bottom: 16px; }
    input, button { padding: 12px 14px; border-radius: 8px; border: none; font-size: 1rem; }
    input { background: #334155; color: white; outline: none; flex: 1; }
    .action-btn { background: #0284c7; color: white; cursor: pointer; font-weight: 600; }
    .action-btn:active { background: #0369a1; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px auto; max-width: 280px; }
    .cell { aspect-ratio: 1; background: #334155; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 800; cursor: pointer; user-select: none; }
    .cell.x { color: #38bdf8; }
    .cell.o { color: #f43f5e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SyncGrid Multiplayer</h1>

    <div class="mode-switch">
      <button id="btn-mode-online" class="mode-btn active" onclick="switchMode('online')">Online Rooms</button>
      <button id="btn-mode-local" class="mode-btn" onclick="switchMode('local')">Pass & Play (Local)</button>
    </div>

    <div id="status" class="status">Enter Room Name to Play</div>
    <div id="role-display" class="role-text">Ready</div>

    <div class="controls" id="join-controls">
      <input type="text" id="room-name" placeholder="Enter Room (e.g. 777)" value="arena99" />
      <button class="action-btn" onclick="startRoom()">Join Game</button>
    </div>

    <div class="grid" id="grid">
      <div class="cell" onclick="cellClicked(0)"></div>
      <div class="cell" onclick="cellClicked(1)"></div>
      <div class="cell" onclick="cellClicked(2)"></div>
      <div class="cell" onclick="cellClicked(3)"></div>
      <div class="cell" onclick="cellClicked(4)"></div>
      <div class="cell" onclick="cellClicked(5)"></div>
      <div class="cell" onclick="cellClicked(6)"></div>
      <div class="cell" onclick="cellClicked(7)"></div>
      <div class="cell" onclick="cellClicked(8)"></div>
    </div>

    <button onclick="sendReset()" class="action-btn" style="margin-top: 10px; width: 100%; background: #475569;">Restart Round</button>
  </div>

  <script>
    let mode = 'online';
    let client = null;
    let room = '';
    let myRole = ''; 
    let currentTurn = 'X';
    let board = Array(9).fill(null);
    let myId = 'p_' + Math.random().toString(36).substring(2, 8);

    function switchMode(newMode) {
      mode = newMode;
      document.getElementById('btn-mode-online').className = 'mode-btn ' + (mode === 'online' ? 'active' : '');
      document.getElementById('btn-mode-local').className = 'mode-btn ' + (mode === 'local' ? 'active' : '');
      board = Array(9).fill(null);
      currentTurn = 'X';
      updateBoardView();

      if (mode === 'local') {
        document.getElementById('join-controls').style.display = 'none';
        document.getElementById('role-display').innerText = 'Local 2-Player Mode Active';
        document.getElementById('status').innerText = 'Player X Turn (Tap any box)';
      } else {
        document.getElementById('join-controls').style.display = 'flex';
        document.getElementById('role-display').innerText = 'Ready';
        document.getElementById('status').innerText = 'Enter Room Name to Play';
      }
    }

    function startRoom() {
      room = document.getElementById('room-name').value.trim();
      if (!room) return alert('Room name likhiye!');

      document.getElementById('status').innerText = 'Connecting...';

      client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", myId);
      
      client.onMessageArrived = (message) => {
        const payload = JSON.parse(message.payloadString);

        if (payload.action === 'announce') {
          if (payload.sender !== myId && myRole === 'X') {
            publishAction({ action: 'assign_o', target: payload.sender });
            document.getElementById('status').innerText = 'Player Joined! Your turn (X)';
          }
        } 
        else if (payload.action === 'assign_o') {
          if (payload.target === myId) {
            myRole = 'O';
            document.getElementById('role-display').innerText = 'You are: Player O';
            document.getElementById('role-display').style.color = '#f43f5e';
            document.getElementById('status').innerText = "Connected! Opponent's turn (X)";
          }
        }
        else if (payload.action === 'move') {
          board[payload.index] = payload.symbol;
          currentTurn = payload.symbol === 'X' ? 'O' : 'X';
          updateBoardView();
        }
        else if (payload.action === 'reset') {
          board = Array(9).fill(null);
          currentTurn = 'X';
          updateBoardView();
          document.getElementById('status').innerText = 'Round Restarted! Turn: X';
        }
      };

      client.connect({
        useSSL: true,
        timeout: 5,
        onSuccess: () => {
          client.subscribe("syncgrid/game/" + room);
          document.getElementById('join-controls').style.display = 'none';

          myRole = 'X';
          document.getElementById('role-display').innerText = 'You are: Player X';
          document.getElementById('role-display').style.color = '#38bdf8';
          document.getElementById('status').innerText = 'Room joined! Waiting for Player 2...';

          publishAction({ action: 'announce', sender: myId });
        },
        onFailure: (err) => {
          alert('Failed to connect: ' + err.errorMessage);
          document.getElementById('status').innerText = 'Failed. Try again.';
        }
      });
    }

    function publishAction(data) {
      if (!client || !client.isConnected()) return;
      const msg = new Paho.MQTT.Message(JSON.stringify(data));
      msg.destinationName = "syncgrid/game/" + room;
      client.send(msg);
    }

    function cellClicked(index) {
      if (mode === 'local') {
        if (board[index] || checkWinner()) return;
        board[index] = currentTurn;
        currentTurn = currentTurn === 'X' ? 'O' : 'X';
        updateBoardView();
        return;
      }

      if (!myRole) return alert('Pehle Join Game dabaiye!');
      if (board[index]) return;
      if (currentTurn !== myRole) {
        return alert("Abhi aapki baari nahi hai! Turn: " + currentTurn);
      }

      board[index] = myRole;
      currentTurn = myRole === 'X' ? 'O' : 'X';
      updateBoardView();

      publishAction({ action: 'move', index: index, symbol: myRole });
    }

    function updateBoardView() {
      const cells = document.getElementsByClassName('cell');
      for (let i = 0; i < 9; i++) {
        cells[i].innerText = board[i] || '';
        cells[i].className = 'cell ' + (board[i] ? board[i].toLowerCase() : '');
      }
      
      const winner = checkWinner();
      if (winner) {
        document.getElementById('status').innerText = (mode === 'local') ? ("🏆 Winner: Player " + winner + "!") : (winner === myRole ? "🎉 You Won!" : "Opponent Won!");
      } else if (board.every(c => c !== null)) {
        document.getElementById('status').innerText = "Match Draw!";
      } else {
        if (mode === 'local') {
          document.getElementById('status').innerText = "Player " + currentTurn + " Turn";
        } else {
          document.getElementById('status').innerText = currentTurn === myRole ? "Your Turn (" + myRole + ")!" : "Opponent's Turn (" + currentTurn + ")...";
        }
      }
    }

    function checkWinner() {
      const lines = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      for (let l of lines) {
        if (board[l[0]] && board[l[0]] === board[l[1]] && board[l[1]] === board[l[2]]) {
          return board[l[0]];
        }
      }
      return null;
    }

    function sendReset() {
      if (mode === 'local') {
        board = Array(9).fill(null);
        currentTurn = 'X';
        updateBoardView();
      } else {
        publishAction({ action: 'reset' });
      }
    }
  </script>
</body>
</html>
